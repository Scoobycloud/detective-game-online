name: Supabase DB Migrate

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List migrations directory
        working-directory: backend
        run: |
          pwd
          ls -la
          ls -la supabase || true
          ls -la supabase/migrations || true

      - name: Install psql client
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client

      - name: Apply migrations via psql (temporary reliable path)
        working-directory: backend
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for file in supabase/migrations/*.sql; do
            echo "-- Applying: $file"
            PGPASSWORD="$(printf '%s' "$SUPABASE_DB_URL" | sed -E 's#^.*://[^:]+:([^@]+)@.*$#\1#')" \
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "$file"
          done


