name: Supabase DB Migrate

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        run: |
          curl -sL https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz \
          | tar -xz && sudo mv supabase /usr/local/bin/supabase

      - name: Supabase CLI version
        run: supabase --version

      - name: List migrations directory
        working-directory: backend
        run: |
          pwd
          ls -la
          ls -la supabase || true
          ls -la supabase/migrations || true

      - name: Apply migrations via Supabase SQL API (verbose)
        working-directory: backend
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          sudo apt-get update -y >/dev/null 2>&1 || true
          sudo apt-get install -y jq >/dev/null 2>&1 || true
          API="https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/sql"
          shopt -s nullglob
          for file in supabase/migrations/*.sql; do
            echo "-- Applying: $file"
            DATA=$(jq -Rs . < "$file")
            RESP=$(mktemp)
            CODE=$(curl -sS -w "\n%{http_code}" -o "$RESP" -X POST "$API" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"query\":${DATA}}" | tail -n1)
            echo "HTTP $CODE"
            cat "$RESP" | jq . || cat "$RESP"
            rm -f "$RESP"
            echo
          done


